name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      # Make selects the supported CLT/SDK pair and rejects missing or mismatched
      # tools. Use the same selection for local and noninteractive checks.
      - name: Verify pinned tools, tests and app
        run: make check
