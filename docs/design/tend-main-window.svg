<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Tend task window and menu bar panel</title>
  <desc id="desc">Original Tend concept. A sidebar lists scripts. The selected Update developer tools task shows its daily schedule, script details, successful run, and output. A compact menu bar panel shows running and upcoming tasks.</desc>
  <defs>
    <linearGradient id="desk" x2="1" y2="1"><stop stop-color="#dbe5e8"/><stop offset="1" stop-color="#cbd8df"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#243847" flood-opacity=".16"/></filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; fill: #20272d; }
      .muted { fill: #69747e; } .small { font-size: 12px; } .body { font-size: 14px; }
      .label { font-size: 13px; font-weight: 600; } .heading { font-size: 17px; font-weight: 600; }
      .mono { font-family: 'SF Mono', Menlo, monospace; font-size: 12px; }
      .blue { fill: #0868d0; } .green { fill: #287846; }
      .line { stroke: #dce1e5; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1440" height="920" fill="url(#desk)"/>
  <text x="64" y="57" font-size="25" font-weight="600">Tend</text>
  <text x="64" y="83" class="body muted">Scripts and agents, on your schedule.</text>
  <text x="1376" y="57" text-anchor="end" class="small muted">Design concept · Script milestone</text>

  <g filter="url(#shadow)">
    <rect x="48" y="120" width="1000" height="728" rx="16" fill="#fbfcfd" stroke="#b9c4cc"/>
    <path d="M64 120H288V848H64Q48 848 48 832V136Q48 120 64 120Z" fill="#eaf0f3"/>
    <line x1="288" y1="120" x2="288" y2="848" class="line"/>
  </g>
  <circle cx="73" cy="147" r="6" fill="#ff6058"/><circle cx="93" cy="147" r="6" fill="#ffbd2e"/><circle cx="113" cy="147" r="6" fill="#28c840"/>
  <text x="70" y="196" class="heading">Tasks</text>
  <rect x="229" y="174" width="34" height="30" rx="8" fill="#ffffff" stroke="#d3dce2"/>
  <text x="246" y="195" text-anchor="middle" font-size="23" class="blue">+</text>
  <rect x="66" y="220" width="204" height="32" rx="7" fill="#ffffff" stroke="#d7dfe4"/>
  <text x="78" y="241" class="body muted">Search tasks</text>
  <rect x="66" y="268" width="204" height="28" rx="7" fill="#dfe6eb"/>
  <rect x="68" y="270" width="43" height="24" rx="5" fill="#ffffff"/>
  <text x="89" y="287" text-anchor="middle" class="small">All</text>
  <text x="156" y="287" text-anchor="middle" class="small muted">Scheduled</text>
  <text x="237" y="287" text-anchor="middle" class="small muted">Paused</text>
  <rect x="60" y="313" width="216" height="75" rx="9" fill="#d4e6f8"/>
  <text x="74" y="337" class="label">Update developer tools</text>
  <text x="74" y="359" class="small muted">Daily at 9:00 AM</text>
  <text x="74" y="377" class="small green">✓ Last run succeeded</text>
  <text x="74" y="420" class="label">Back up documents</text>
  <text x="74" y="442" class="small muted">Daily at 6:00 PM</text>
  <text x="74" y="460" class="small blue">◌ Running · 12 seconds</text>
  <line x1="74" y1="480" x2="262" y2="480" class="line"/>
  <text x="74" y="509" class="label">Clean downloads</text>
  <text x="74" y="531" class="small muted">Schedule paused</text>
  <text x="74" y="549" class="small muted">Not run yet</text>
  <line x1="66" y1="791" x2="270" y2="791" class="line"/>
  <text x="74" y="823" class="body muted">Settings</text>
  <text x="258" y="823" text-anchor="end" class="small muted">3 tasks</text>

  <text x="318" y="159" class="small muted">Script</text>
  <text x="318" y="194" font-size="25" font-weight="600">Update developer tools</text>
  <text x="318" y="221" class="body muted">Keep your command-line tools up to date.</text>
  <rect x="318" y="243" width="108" height="33" rx="8" fill="#0868d0"/>
  <text x="372" y="265" text-anchor="middle" style="fill:white" class="label">▶ Run Now</text>
  <rect x="436" y="243" width="66" height="33" rx="8" fill="#f0f3f5" stroke="#dce1e5"/>
  <text x="469" y="265" text-anchor="middle" class="label">Edit</text>
  <text x="851" y="264" class="body muted">Scheduled</text>
  <rect x="940" y="246" width="40" height="24" rx="12" fill="#0868d0"/><circle cx="968" cy="258" r="9" fill="white"/>
  <text x="1008" y="265" text-anchor="middle" font-size="21" class="muted">⋯</text>
  <line x1="318" y1="299" x2="1018" y2="299" class="line"/>

  <text x="318" y="331" class="heading">Schedule</text>
  <text x="318" y="361" class="body">Every day at 9:00 AM</text>
  <text x="1018" y="361" text-anchor="end" class="small muted">America/Chicago</text>
  <text x="318" y="387" class="small muted">Next run tomorrow, October 30 at 9:00 AM</text>
  <line x1="318" y1="408" x2="1018" y2="408" class="line"/>
  <text x="318" y="440" class="heading">Script</text>
  <text x="318" y="469" class="small muted">File</text>
  <text x="426" y="469" class="mono">~/Scripts/update-tools.zsh</text>
  <text x="318" y="495" class="small muted">Interpreter</text>
  <text x="426" y="495" class="mono">/bin/zsh</text>
  <text x="318" y="521" class="small muted">Working folder</text>
  <text x="426" y="521" class="mono">~/Scripts</text>
  <line x1="318" y1="542" x2="1018" y2="542" class="line"/>
  <text x="318" y="575" class="heading">Recent runs</text>
  <text x="1018" y="575" text-anchor="end" class="small blue">View all runs</text>
  <rect x="318" y="591" width="700" height="43" rx="7" fill="#eef3f7"/>
  <text x="331" y="618" class="body green">✓ Succeeded</text>
  <text x="515" y="618" class="body muted">Today at 9:00 AM</text>
  <text x="991" y="618" text-anchor="end" class="small muted">8 seconds</text>
  <text x="331" y="664" class="small" font-weight="600">Output</text>
  <text x="1004" y="664" text-anchor="end" class="small muted">Exit code 0    Copy</text>
  <rect x="318" y="678" width="700" height="131" rx="8" fill="#f0f2f4" stroke="#e0e5e8"/>
  <text x="334" y="704" class="mono muted">09:00:00  Checking installed tools…</text>
  <text x="334" y="729" class="mono muted">09:00:04  Updates complete.</text>
  <text x="334" y="754" class="mono muted">09:00:08  All tools are up to date.</text>
  <text x="334" y="788" class="mono green">Process finished successfully.</text>

  <text x="1090" y="147" class="small muted">Menu bar panel</text>
  <g filter="url(#shadow)"><rect x="1080" y="168" width="312" height="416" rx="17" fill="#f3f6f8" stroke="#bfcbd3"/></g>
  <text x="1100" y="203" class="heading">Tend</text>
  <text x="1332" y="204" font-size="22" class="blue">+</text>
  <text x="1365" y="202" font-size="17" class="muted">↗</text>
  <line x1="1096" y1="220" x2="1376" y2="220" class="line"/>
  <text x="1100" y="250" class="small muted">Running</text>
  <rect x="1096" y="263" width="280" height="76" rx="12" fill="#ffffff" stroke="#dde5eb"/>
  <text x="1108" y="289" class="label">Back up documents</text>
  <text x="1108" y="314" class="small blue">◌ 12 seconds</text>
  <rect x="1314" y="298" width="50" height="26" rx="7" fill="#edf1f4"/>
  <text x="1339" y="316" text-anchor="middle" class="small">Stop</text>
  <text x="1100" y="370" class="small muted">Up next</text>
  <rect x="1096" y="383" width="280" height="80" rx="12" fill="#ffffff" stroke="#dde5eb"/>
  <text x="1108" y="408" class="label">Update developer tools</text>
  <text x="1108" y="433" class="small muted">Tomorrow, 9:00 AM</text>
  <text x="1359" y="448" text-anchor="end" class="small blue">Run Now</text>
  <text x="1100" y="497" class="small muted">1 schedule paused</text>
  <line x1="1096" y1="517" x2="1376" y2="517" class="line"/>
  <text x="1100" y="550" class="body blue">Open Tend</text>
  <text x="1372" y="550" text-anchor="end" class="small muted">Settings</text>
  <text x="1090" y="628" class="label">One task, one clear view.</text>
  <text x="1090" y="653" class="body muted">Schedule, script, and results</text>
  <text x="1090" y="675" class="body muted">stay together.</text>
  <text x="64" y="886" class="small muted">Original Tend mock-up · Fictional task data · Layout reference, not a running app</text>
</svg>
